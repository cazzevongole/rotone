name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    name: Build debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rotone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish APK to Releases
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the debug APK
        uses: actions/download-artifact@v4
        with:
          name: rotone-debug-apk
          path: dist

      - name: Read the app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "(.*)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or update the release and attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK="rotone-v${VERSION}.apk"
          cp dist/app-debug.apk "dist/${APK}"
          ls -l dist
          NOTES="Debug build of RoTone ${VERSION} from ${GITHUB_SHA}. Install with: adb install -r ${APK}, then grant notification access and set the apps you cover to Silent. See the README for the full setup."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "RoTone ${VERSION}" --notes "$NOTES"
            gh release delete-asset "$TAG" app-debug.apk --yes >/dev/null 2>&1 || true
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "RoTone ${VERSION}" --notes "$NOTES"
          fi
          gh release upload "$TAG" "dist/${APK}" --clobber
          echo "Published: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
